[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pure-nav-agent-research"
version = "0.1.0"
description = "Authored pure model-action costed NAV research components"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["training*", "trader_runtime*", "trading_desk*", "pa_tws*", "examples*"]
